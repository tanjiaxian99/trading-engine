<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-label="Wire-to-wire tick-to-trade dropped from 148.8 microseconds p50 and 203.4 microseconds p99 to 6.4 and 11.7 across seven changes">

  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .bg { fill: #fcfcfb; }
