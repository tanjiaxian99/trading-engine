    .secondary { fill: #52514e; }
    .muted { fill: #898781; }
    .grid { stroke: #e1e0d9; }
    .baseline { stroke: #c3c2b7; }
    .p50 { fill: #2a78d6; }
    .p99 { fill: #eb6834; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .bg { fill: #1a1a19; }
